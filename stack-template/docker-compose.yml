# One project stack: Postgres + n8n + pgAdmin + an nginx website.
#
# Copy this folder once per project, fill in .env, then:
#   docker compose up -d
#
# Every published port binds to 127.0.0.1 only, so nothing is reachable from your
# network. To put a service on the internet, use a tunnel that reaches the container
# by name (see GUIDE.md), not by opening ports.
#
# Image versions are pinned on purpose. Change one at a time, after a backup.

services:

  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      # $$ reads the variable inside the container
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:2.45.4
    container_name: ${COMPOSE_PROJECT_NAME}-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy     # wait until the database is ready
    ports:
      - "127.0.0.1:${N8N_LOCAL_PORT}:5678"
    environment:
      # Database: workflows and credentials live here, not in your repo
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # Encrypts saved credentials. Back this up; without it, restored credentials are unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Public address (used when n8n sits behind a tunnel)
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}

      # Keep execution history from swallowing the database (7 days)
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168

      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
    volumes:
      - ./n8n:/home/node/.n8n

  pgadmin:
    image: dpage/pgadmin4:9.11
    container_name: ${COMPOSE_PROJECT_NAME}-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:${PGADMIN_LOCAL_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      # Server mode requires a login. Never run pgAdmin in desktop mode behind a tunnel.
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - ./pgadmin:/var/lib/pgadmin

  website:
    image: nginx:1.29-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_LOCAL_PORT}:80"
    volumes:
      # Everything in ./website is public, dotfiles included. Never put .env or .git here.
      - ./website:/usr/share/nginx/html:ro

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}-network
